name: refresh panels

# The panels in the README are snapshots of the gitskins endpoints, so the
# heatmap would otherwise freeze on the day it was downloaded. Re-fetch daily
# and commit only what actually changed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  QUERY: "theme=github-dark&v=sync-intro-4&style=terminal&mode=dark"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-fetch the panels
        # The endpoints sit behind a one-hour CDN cache that can hand back a
        # stale calendar — it served 3 contributions when the real count was
        # 136 — so every request carries a cache-busting parameter.
        run: |
          for section in portrait wordmark heatmap; do
            curl -sSfL --retry 3 --retry-delay 5 \
              "https://www.gitskins.com/api/section/$section?username=${{ github.repository_owner }}&$QUERY&cb=$(date +%s)" \
              -o "assets/gs-$section.svg"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Strip the vendor watermark
        # Each fresh download stamps "gitskins.com" back into the corner, so
        # this has to run on every refresh, not once by hand.
        run: python3 tools/strip_watermark.py assets/gs-portrait.svg assets/gs-wordmark.svg assets/gs-heatmap.svg

      - name: Recompose the Terminal Identity window
        run: python3 tools/build_identity.py -o assets/identity.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "panels unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile panels" -- assets
          git push
